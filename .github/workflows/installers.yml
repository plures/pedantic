name: Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to package (for verification or recovery)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Resolve release tag ─────────────────────────────────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve the published release tag
        id: release
        env:
          TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$TAG_NAME"
          if [[ -z "$tag" ]]; then
            echo "No release tag was supplied by the release event or workflow_dispatch input." >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ── Windows MSI (x86_64) ──────────────────────────────────────────
  windows-msi:
    needs: resolve
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build CLI (release)
        working-directory: rust
        run: cargo build --release --package pedantic

      - name: Install WiX v5
        shell: pwsh
        # WiX v6+ requires an OSMF EULA acknowledgement. Pin the last
        # pre-OSMF major so public CI can build the MSI without an implicit
        # legal acceptance; update deliberately if the licensing choice changes.
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          wix build `
            -d Version=${{ needs.resolve.outputs.version }} `
            -d BinSource=rust/target/release `
            -d ModuleSource=. `
            -o dist/pedantic-${{ needs.resolve.outputs.version }}-windows-x86_64.msi `
            installers/windows/pedantic.wxs

      - name: Upload MSI to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          files: dist/*.msi

  # ── macOS pkg (universal: x86_64 + aarch64) ───────────────────────
  macos-pkg:
    needs: resolve
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build CLI (aarch64)
        working-directory: rust
        run: cargo build --release --package pedantic --target aarch64-apple-darwin

      - name: Build CLI (x86_64)
        working-directory: rust
        run: cargo build --release --package pedantic --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist/bin
          lipo -create \
            rust/target/aarch64-apple-darwin/release/pedantic \
            rust/target/x86_64-apple-darwin/release/pedantic \
            -output dist/bin/pedantic

      - name: Build pkg
        run: |
          chmod +x installers/macos/build-pkg.sh
          ./installers/macos/build-pkg.sh \
            "${{ needs.resolve.outputs.version }}" \
            dist/bin \
            . \
            dist

      - name: Upload pkg to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          files: dist/*.pkg

  # ── Linux DEB (x86_64) ──────────────────────────────────────────────
  linux-deb:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build CLI (release)
        working-directory: rust
        run: cargo build --release --package pedantic --target x86_64-unknown-linux-gnu

      - name: Build DEB
        run: |
          chmod +x installers/linux/build-deb.sh
          ./installers/linux/build-deb.sh \
            "${{ needs.resolve.outputs.version }}" \
            rust/target/x86_64-unknown-linux-gnu/release \
            . \
            dist

      - name: Upload DEB to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          files: dist/*.deb

  # ── Linux RPM (x86_64) — Azure Linux, Fedora, RHEL ────────────────
  linux-rpm:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build CLI (release)
        working-directory: rust
        run: cargo build --release --package pedantic --target x86_64-unknown-linux-gnu

      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM
        run: |
          chmod +x installers/linux/build-rpm.sh
          ./installers/linux/build-rpm.sh \
            "${{ needs.resolve.outputs.version }}" \
            rust/target/x86_64-unknown-linux-gnu/release \
            . \
            dist

      - name: Upload RPM to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          files: dist/*.rpm
