name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force version bump (patch/minor/major)'
        type: choice
        options: [patch, minor, major]
      target_version:
        description: 'Exact version to release (e.g. 1.0.0). Overrides bump logic.'
        type: string
        required: false
concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  actions: write

jobs:
  release_pr_guard:
    name: Check for an open release-preparation PR
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check for an open release-preparation PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_release_prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE" \
            --state open \
            --json title \
            --jq '[.[] | select(.title | startswith("chore(release): v"))] | length')"
          if [[ "$open_release_prs" != "0" ]]; then
            echo "::notice::An open release-preparation PR already targets $BASE; skipping duplicate release generation."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: release_pr_guard
    if: ${{ needs.release_pr_guard.outputs.should_release == 'true' }}
    uses: plures/.github/.github/workflows/release-reusable.yml@main
    with:
      bump: ${{ inputs.bump || '' }}
      target_version: ${{ inputs.target_version || '' }}
      version_manifest_path: rust/Cargo.toml
    secrets: inherit

  trigger-installers:
    name: Trigger installers workflow
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest published release tag
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_name="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          if [[ -z "${tag_name}" || "${tag_name}" == "null" ]]; then
            echo "No published release found; skipping installer dispatch."
            exit 0
          fi
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Dispatch installers workflow
        if: ${{ steps.latest_release.outputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run installers.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag_name=${{ steps.latest_release.outputs.tag_name }}
