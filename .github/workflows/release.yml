name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  validate-release:
    name: Validate Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version
        shell: pwsh
        run: |
          $version = if ('${{ github.event.inputs.version }}') {
            '${{ github.event.inputs.version }}'
          } else {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          }
          
          Write-Host "Validating version: $version"
          
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version format: $version. Expected: X.Y.Z"
          }
          
          # Check if version in manifest matches
          $manifestVersion = (Import-PowerShellDataFile './Pedantic.psd1').ModuleVersion
          if ($manifestVersion -ne $version) {
            throw "Version mismatch: Manifest=$manifestVersion, Release=$version"
          }
          
          Write-Host "Version validation passed: $version"
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Generate changelog
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $previousTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          
          if ($previousTag) {
            Write-Host "Generating changelog from $previousTag to v$version"
            $changes = git log "$previousTag..HEAD" --pretty=format:"- %s (%h)" --no-merges
          } else {
            Write-Host "No previous tag found. Using all commits."
            $changes = git log --pretty=format:"- %s (%h)" --no-merges
          }
          
          $changelog = @"
          # Release v$version
          
          ## Changes
          
          $changes
          
          ---
          *Generated on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')*
          "@
          
          $changelog | Out-File -FilePath changelog.md -Encoding utf8
          Write-Host "Changelog generated:"
          Get-Content changelog.md

      - name: Upload changelog
        uses: actions/upload-artifact@v6
        with:
          name: changelog
          path: changelog.md
          retention-days: 30

  build-release:
    name: Build Release Package
    needs: validate-release
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          if (Test-Path 'tests') {
            Write-Host "Running final tests before release..."
            Invoke-Pester -Path 'tests' -Output Detailed -CI
          }

      - name: Build release package
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'release'
          if (-not (Test-Path $out)) { New-Item -ItemType Directory -Path $out | Out-Null }
          
          $version = (Import-PowerShellDataFile './Pedantic.psd1').ModuleVersion
          $moduleName = 'Pedantic'
          
          # Create release package directory structure
          $releaseDir = Join-Path $out $moduleName
          if (Test-Path $releaseDir) { Remove-Item -Recurse -Force $releaseDir }
          New-Item -ItemType Directory -Path $releaseDir | Out-Null
          
          # Copy module files
          $filesToCopy = @(
            'Pedantic.psd1',
            'Pedantic.psm1',
            'Pedantic.Reverse.psm1',
            'Resources',
            'SimpleDSC.psd1',
            'Simple.DSC.psm1',
            'Simple.DSC.Basic.psm1',
            'README.md',
            'docs',
            'LICENSE'
          )
          
          foreach ($file in $filesToCopy) {
            if (Test-Path $file) {
              Copy-Item -Path $file -Destination $releaseDir -Recurse -Force
            }
          }
          
          # Create ZIP archive
          $zipPath = Join-Path $out "$moduleName-v$version.zip"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force
          
          Write-Host "Release package created: $zipPath"
          
          # Calculate hash
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          $hash | Out-File -FilePath (Join-Path $out "$moduleName-v$version.zip.sha256") -Encoding utf8
          
          Write-Host "SHA256: $hash"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-package
          path: release/*
          retention-days: 90

  create-github-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download changelog
        uses: actions/download-artifact@v4.1.3
        with:
          name: changelog

      - name: Download release package
        uses: actions/download-artifact@v4.1.3
        with:
          name: release-package
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: |
            release/*.zip
            release/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-powershell-gallery:
    name: Publish to PowerShell Gallery
    needs: create-github-release
    runs-on: windows-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download release package
        uses: actions/download-artifact@v4.1.3
        with:
          name: release-package
          path: release

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            Write-Warning "PSGALLERY_API_KEY secret not set. Skipping PowerShell Gallery publish."
            return
          }
          
          $modulePath = Join-Path $PWD 'release' 'Pedantic'
          
          if (-not (Test-Path $modulePath)) {
            throw "Module path not found: $modulePath"
          }
          
          Write-Host "Publishing module to PowerShell Gallery..."
          Publish-Module -Path $modulePath -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
          
          Write-Host "Module published successfully!"
