name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize ADP Submodule (if configured)
        shell: pwsh
        continue-on-error: true
        run: |
          # Only initialize submodules if .gitmodules exists and contains ADP
          if (Test-Path '.gitmodules') {
            $hasAdp = Get-Content '.gitmodules' -Raw | Select-String '\.adp'
            if ($hasAdp) {
              Write-Host "ADP submodule found in .gitmodules, initializing..."
              git submodule update --init --recursive
            }
          }

      - name: Initialize ADP (if available)
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path '.adp/scripts/init.ps1') {
            Write-Host "ADP found, initializing..."
            ./.adp/scripts/init.ps1
          } elseif (Test-Path '.adp-placeholder') {
            Write-Host "ADP placeholder found. ADP integration is pending."
            Write-Host "See ADP-INTEGRATION.md for setup instructions."
          } else {
            Write-Host "ADP not configured."
          }

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (Test-Path './PSScriptAnalyzerSettings.psd1') {
            Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -ReportSummary -Severity Warning,Error
          } else {
            Invoke-ScriptAnalyzer -Path . -Recurse -ReportSummary -Severity Warning,Error
          }

      - name: Run Pester
        shell: pwsh
        run: |
          Invoke-Pester -Path 'tests' -Output Detailed -CI

      - name: Install DSC v3 CLI
        shell: pwsh
        run: |
          winget install --id Microsoft.DSC --exact --accept-source-agreements --accept-package-agreements --disable-interactivity
          $dsc = Get-Command dsc -ErrorAction Stop
          & $dsc.Source --version

      - name: Verify custom resources with real DSC v3 CLI
        shell: pwsh
        run: |
          ./tests/dsc-v3-compatibility.ps1

      - name: Validate PX procedures with the canonical parser
        shell: pwsh
        run: |
          ./scripts/Test-PxProcedures.ps1

      - name: Test Rust workspace and MCP server
        shell: pwsh
        run: |
          Push-Location rust
          cargo test --workspace
          cargo build -p pedantic-mcp
          Pop-Location
          $env:Path = "${env:ProgramFiles}\PowerShell\7;${env:Path}"
          $resourceDirectory = Join-Path $PWD 'Resources/SimpleDSC.PackageInstaller'
          $pwshDirectory = Split-Path (Get-Command pwsh -ErrorAction Stop).Source -Parent
          $env:DSC_RESOURCE_PATH = "$resourceDirectory$([IO.Path]::PathSeparator)$pwshDirectory"
          node ./tests/mcp-smoke.mjs

      - name: Package module (zip)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'dist'
          if (-not (Test-Path $out)) { New-Item -ItemType Directory -Path $out | Out-Null }
          $ver = (Import-PowerShellDataFile './Pedantic.psd1').ModuleVersion
          $stamp = (Get-Date).ToString('yyyyMMdd-HHmmss')
          $folder = 'Pedantic'
          $src = @(
            'Pedantic.psd1',
            'Pedantic.psm1',
            'Pedantic.Reverse.psm1',
            'Resources',
            
            'SimpleDSC.psd1',
            'Simple.DSC.psm1',
            'Simple.DSC.Basic.psm1',
            'docs',
            'README.md'
          ) | Where-Object { Test-Path $_ }
          $temp = Join-Path $env:TEMP $folder
          if (Test-Path $temp) { Remove-Item -Recurse -Force $temp }
          New-Item -ItemType Directory -Path $temp | Out-Null
          Copy-Item -Recurse -Force -Path $src -Destination $temp
          Compress-Archive -Path (Join-Path $temp '*') -DestinationPath (Join-Path $out "$folder-$ver-$stamp.zip") -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-dist
          path: dist/*.zip

