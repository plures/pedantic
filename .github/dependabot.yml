version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "plures/maintainers"

  # NPM dependencies (for extension)
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
      - "automated"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    reviewers:
      - "plures/maintainers"
    # Group security updates together
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
        dependency-type: "production"
    # Ignore development dependencies with minor/patch updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
        dependency-type: "development"
    versioning-strategy: increase
