[workspace]
resolver = "3"
members = [
  "crates/pedantic-core",
  "crates/pedantic-executor",
  "crates/pedantic-cli",
  "crates/pedantic-node",
  "crates/pedantic-mcp",
  "crates/pedantic-service",
  "crates/pedantic-operation",
  "crates/pedantic-capability",
  "crates/pedantic-agent",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/plures/pedantic"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
minijinja = "2.8"
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "process"] }
tracing = "0.1"
regex = "1.10"
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "2.2"
sha2 = "0.10"
jsonschema = "0.18"
