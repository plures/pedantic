[package]
name = "pedantic-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for Pedantic Simple DSC: parse, map, render, template"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "1"
minijinja = { version = "1.0", features = ["loader"] }
sha2 = "0.10"
hex = "0.4"
evalexpr = "9"

[dev-dependencies]
serde_json = "1"
