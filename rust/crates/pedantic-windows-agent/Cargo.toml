[package]
name = "pedantic-windows-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows host adapters for the Pedantic durable target agent"

[dependencies]
thiserror.workspace = true
pedantic-operation = { path = "../pedantic-operation" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading"] }
