[package]
name = "pedantic-mcp"
version = "0.6.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) server exposing Pedantic's DSC v3 resource discovery and execution capabilities as MCP tools"

[[bin]]
name = "pedantic-mcp"
path = "src/main.rs"

[dependencies]
pedantic-core = { path = "../pedantic-core" }
pedantic-executor = { path = "../pedantic-executor" }
pedantic-service = { path = "../pedantic-service" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
schemars = "1"
rmcp = { version = "2.0.0", features = ["server", "transport-io", "macros", "schemars"] }

[dev-dependencies]
tokio = { version = "1.46", features = ["rt-multi-thread", "macros", "process", "io-util"] }
