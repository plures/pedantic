$schema: https://aka.ms/dsc/schemas/v3/config/document.json
metadata:
  name: Install Git via WinGet
resources:
  - name: installGit
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    properties:
      executable: 'winget'
      arguments: 
        - 'install'
        - '--id'
        - 'Git.Git'
        - '--source'
        - 'winget'
        - '--accept-package-agreements'
        - '--accept-source-agreements'
