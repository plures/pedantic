$schema: https://aka.ms/dsc/schemas/v3/config/document.json
metadata:
  name: Install Node.js and Apache ECharts
resources:
  - name: npm
    type: Microsoft.WinGet.DSC/WinGetPackage
    properties:
      id: OpenJS.NodeJS
      source: winget
      ensure: Present
  - name: npm-install
    type: Microsoft.WinGet.DSC/WinGetPackage
    dependsOn:
      - npm
    properties:
      PackageDirectory: '${WinGetConfigRoot}\..\'